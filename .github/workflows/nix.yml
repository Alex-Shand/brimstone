name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
    - name: Check
      run: nix flake check path:.
    - name: Deadnix
      run: nix run github:astro/deadnix .
